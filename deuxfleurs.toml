[[cors]]
allowed_origins = "*"
allowed_methods = ["GET", "POST"]
allowed_headers = "*"

[[headers]]
for = ["**/*.woff2", "**/*.woff", "**/*.svg", "**/*.ttf", "**/*.otf", "**/*.eot", "**/*.js", "**/*.css"]
compress = "gzip"
[headers.values]
Cache-Control = "max-age=31536000, no-transform, public"

[[headers]]
for = ["**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.gif", "**/*.webp"]
[headers.values]
Cache-Control = "max-age=31536000, no-transform, public"

[[redirects]]
from = "/offres-d-emploi/index.html"
to = "/offres/"

[[redirects]]
from = "/actualites/2026-07-01-bertrand-chamayou-avec-lorchestre-les-siecles-festival-berlioz/index.html"
to = "/actualites/2021-08-18-bertrand-chamayou-avec-lorchestre-les-siecles-festival-berlioz/"

